<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Numerical Miracles — Sameh Bilal</title>
<link rel="apple-touch-icon" href="../assets/images/favicon.png">
<link rel="shortcut icon" type="image/png" href="../assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<style>
:root{
  --p:#F9812E;
  --sz:25px;
  --ln:color-mix(in lch,canvasText,transparent 70%);
  --bc:rgba(119,119,125,.2);
  --cord:color-mix(in lch,canvas,canvasText 75%);
  --stroke:color-mix(in lch,canvas,canvasText 75%);
  --shine:hsl(210 20% 80%/.75);
  --cap:color-mix(in lch,canvas,canvasText);
  --filament:light-dark(orange,color-mix(in lch,canvas,canvasText 25%));
  --bulb:transparent;
  --wf:24px;
}
[data-theme="light"]{color-scheme:light only}
[data-theme="dark"]{color-scheme:dark only}
html{color-scheme:light dark;height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Poppins",sans-serif;
  background:light-dark(#fff,#000);
  color:light-dark(#444,#e2e2e2);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* grid bg */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,var(--ln) 1px,transparent 1px var(--sz)) 50% 50%/var(--sz) var(--sz),
    linear-gradient(var(--ln) 1px,transparent 1px var(--sz)) 50% 50%/var(--sz) var(--sz);
  -webkit-mask:linear-gradient(-20deg,transparent 50%,white);
  mask:linear-gradient(-20deg,transparent 50%,white);
  pointer-events:none;z-index:0;
}

/* ── HEADER ── */
header{
  flex-shrink:0;
  position:relative;z-index:100;
  display:flex;align-items:center;
  padding:16px 28px;
  gap:16px;
  background:light-dark(rgba(255,255,255,.9),rgba(0,0,0,.9));
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bc);
  transition:background .3s;
}
header.scrolled{background:light-dark(#fff,#000)}

.logo{display:inline-block;font-size:2vmin;text-decoration:none;flex-shrink:0}
.ll{position:relative;display:block;float:left;width:3vmin;height:3vmin;border-top:.25vmin solid light-dark(#000,#fff);line-height:3vmin;text-align:center;color:light-dark(#000,#fff);transition:all .3s}
.ll::before{position:absolute;top:-.25vmin;right:-.25vmin;display:block;width:.25vmin;height:3vmin;background:var(--p);content:""}

.nav-mid{margin:0 auto;display:flex;gap:4px;list-style:none}
.nav-mid a{color:light-dark(#000,#fff);font-size:14px;font-weight:500;padding:6px 14px;text-decoration:none;border-radius:20px;transition:color .2s}
.nav-mid a:hover,.nav-mid a.cur{color:var(--p)}
@media(max-width:767px){.nav-mid{display:none}}

.hbtns{display:flex;align-items:center;gap:12px;flex-shrink:0}
.hire{background:var(--p);color:#fff;font-size:13px;font-weight:600;font-family:"Poppins",sans-serif;border-radius:14px;padding:9px 20px;text-decoration:none;border:1px solid transparent;transition:.3s;white-space:nowrap}
.hire:hover{background:#000}

/* lightbulb */
.lform{position:relative;width:var(--wf);aspect-ratio:1;top:-1.2rem;z-index:9999}
.lform button{width:100%;aspect-ratio:1;position:absolute;top:0;left:0;z-index:3;background:transparent;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
.gh{width:24px;aspect-ratio:1;border-radius:50%;position:absolute;top:calc((24px*.175)+((24px*.65)*(125/48)));left:50%;translate:-50% -50%;z-index:9;outline:2px dashed canvasText!important;background:hsla(29,77%,59%,.25)}
.arr{position:absolute;left:-300%;top:200%;width:140%;container-type:inline-size;color:color-mix(in hsl,canvasText,#0000 40%)}
.arr svg{width:100%;scale:-1 -1}
.arr label{font-family:"Gloria Hallelujah",cursive;position:absolute;bottom:25%;rotate:8deg;font-size:18cqi;white-space:nowrap;top:50%;right:110%}
.ts{overflow:visible!important;position:absolute;width:65%;top:50%;left:50%;translate:-50% -50%}
.ts__cord{stroke:var(--cord);stroke-width:10;cursor:move}
.ts__cord:nth-of-type(1),.ts__cord:nth-of-type(2),.ts__cord:nth-of-type(3),.ts__cord:nth-of-type(4),.ts__cord:nth-of-type(5){display:none}
.ts__ce{stroke:var(--cord);fill:var(--cord)}
.ts__dc{stroke-width:10;stroke:var(--cord)}
.bf{stroke:var(--filament);stroke-width:8}
[data-theme='light'] .bf{stroke-width:12}
.bs{stroke:var(--shine)}
.bb{stroke:var(--stroke);fill:var(--bulb);stroke-width:10}
.bc{fill:var(--cap)}
.bcs{fill:var(--shine)}
.bco{stroke-width:10;stroke:var(--stroke)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── MAIN AREA: two columns ── */
.main{
  flex:1;
  display:flex;
  overflow:hidden;
  position:relative;z-index:1;
}

/* ── LEFT: miracle card ── */
.left-col{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 24px 20px 32px;
  overflow:hidden;
}

.mcard{
  width:100%;max-width:520px;
  padding:28px 32px;
  border-radius:20px;
  border:1px solid rgba(0,0,0,.05);
  box-shadow:rgba(255,255,255,.025) 0 .36px .65px -1px inset,rgba(255,255,255,.036) 0 3px 5.4px -2px inset;
  background:light-dark(#fff,#1D1D1D);
  text-align:center;
  animation:fadeIn .35s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.mtag{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:30px;margin-bottom:12px;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;background:rgba(249,129,46,.1);color:var(--p);border:1px solid rgba(249,129,46,.3)}
.mtag .dot{width:5px;height:5px;border-radius:50%;background:var(--p);flex-shrink:0}

.mnum{font-size:clamp(52px,10vw,110px);font-weight:800;line-height:.88;letter-spacing:-.04em;margin-bottom:10px;color:transparent;-webkit-text-stroke:2px var(--p);user-select:none}
.mnum .f{color:var(--p);-webkit-text-stroke:0}

.mav{direction:rtl;font-size:15px;line-height:2;color:var(--p);font-weight:500;margin-bottom:3px}
.mref{font-size:11px;color:light-dark(#999,#666);margin-bottom:14px}

.mtitle{font-size:clamp(14px,2vw,20px);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px;color:light-dark(#000,#fff)}
.mtitle span{color:transparent;-webkit-text-stroke:1px light-dark(#000,#fff)}

.mdesc{font-size:12px;line-height:1.8;color:light-dark(#666,#a0aec0);margin-bottom:16px;max-width:460px;margin-left:auto;margin-right:auto}

/* equation */
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:12px 16px;border-radius:12px;background:light-dark(rgba(0,0,0,.03),rgba(255,255,255,.03));border:1px solid rgba(249,129,46,.2)}
.eq-t{display:flex;flex-direction:column;align-items:center;min-width:46px}
.eq-v{font-size:18px;font-weight:800;color:var(--p);line-height:1}
.eq-l{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:light-dark(#888,#777);margin-top:2px;white-space:nowrap}
.eq-op{font-size:16px;font-weight:700;color:light-dark(#bbb,#555);margin-top:-4px}
.eq-t.res .eq-v{color:light-dark(#000,#fff)}

/* div cells */
.dlabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:light-dark(#888,#777);margin-bottom:8px}
.dgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:14px}
.dc{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;width:38px;height:38px;border-radius:9px;border:1px solid rgba(249,129,46,.35);background:rgba(249,129,46,.09);color:var(--p)}

.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.sp{display:flex;flex-direction:column;align-items:center;padding:9px 14px;border-radius:12px;min-width:76px;border:1px solid light-dark(rgba(0,0,0,.07),rgba(255,255,255,.07));background:light-dark(rgba(0,0,0,.02),rgba(255,255,255,.02))}
.sp .n{font-size:16px;font-weight:800;color:var(--p);line-height:1}
.sp .l{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:light-dark(#999,#777);margin-top:3px}

.quote{padding:10px 14px;border-radius:10px;font-size:11px;font-style:italic;line-height:1.8;color:light-dark(#555,#b0b8c8);border:1px dashed rgba(249,129,46,.3);background:rgba(249,129,46,.04)}

/* ── RIGHT: miracle list ── */
.right-col{
  width:260px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--bc);
  background:light-dark(rgba(255,255,255,.6),rgba(10,10,10,.6));
  backdrop-filter:blur(8px);
  overflow-y:auto;
  padding:12px 0;
}
.right-col::-webkit-scrollbar{width:4px}
.right-col::-webkit-scrollbar-thumb{background:rgba(249,129,46,.4);border-radius:2px}

/* ── MOBILE BOTTOM SHEET ── */
.sheet-handle-wrap{display:none;justify-content:center;padding:8px 0 4px;cursor:pointer;flex-shrink:0}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:light-dark(rgba(0,0,0,.2),rgba(255,255,255,.2))}
.sheet-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p);text-align:center;padding-bottom:6px;display:none}

.rh{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:light-dark(#aaa,#555);padding:8px 16px 4px;margin-top:4px}

.mitem{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;cursor:pointer;
  border-left:3px solid transparent;
  transition:background .2s,border-color .2s;
}
.mitem:hover{background:light-dark(rgba(249,129,46,.06),rgba(249,129,46,.08))}
.mitem.active{background:rgba(249,129,46,.1);border-left-color:var(--p)}

.mitem-icon{
  width:38px;height:38px;flex-shrink:0;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:light-dark(rgba(0,0,0,.05),rgba(255,255,255,.06));
  border:1px solid light-dark(rgba(0,0,0,.08),rgba(255,255,255,.08));
  transition:background .2s,border-color .2s;
}
.mitem.active .mitem-icon{background:rgba(249,129,46,.15);border-color:rgba(249,129,46,.35)}

.mitem-text{}
.mitem-title{font-size:12px;font-weight:600;color:light-dark(#222,#e2e2e2);line-height:1.3}
.mitem.active .mitem-title{color:var(--p)}
.mitem-sub{font-size:10px;color:light-dark(#888,#777);margin-top:1px}

/* ── DOCK BAR ── */
.dock-wrap{
  flex-shrink:0;
  display:flex;justify-content:center;align-items:flex-end;
  padding:0 0 10px;
  background:transparent;
  position:relative;z-index:50;
}

/* ═══════════════════════════════
   MOBILE RESPONSIVE
═══════════════════════════════ */
@media(max-width:767px){

  body{ overflow:hidden; }

  /* header compact */
  header{ padding:10px 16px; }
  .ll{ width:5vmin; height:5vmin; line-height:5vmin; border-top-width:.4vmin; }
  .ll::before{ width:.4vmin; height:5vmin; top:-.4vmin; right:-.4vmin; }
  .logo{ font-size:3vmin; }
  .lform{ display:none; }

  /* main stacks vertically */
  .main{ flex-direction:column; overflow:hidden; position:relative; }

  /* card col fills available space */
  .left-col{
    flex:1;
    padding:10px 14px 6px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .left-col::-webkit-scrollbar{ display:none; }

  .mcard{ padding:18px 16px; max-width:100%; }
  .mnum{ font-size:clamp(48px,18vw,80px); }
  .mav{ font-size:13px; }
  .mdesc{ font-size:11.5px; }
  .eq{ gap:6px; padding:10px 12px; }
  .eq-v{ font-size:14px; }
  .dc{ width:34px; height:34px; font-size:12px; }
  .sp{ padding:7px 10px; min-width:64px; }
  .sp .n{ font-size:14px; }
  .quote{ font-size:10.5px; padding:8px 12px; }

  /* sidebar becomes a bottom sheet */
  .right-col{
    width:100%;
    flex-shrink:0;
    border-left:none;
    border-top:1px solid var(--bc);
    overflow-y:hidden;
    padding:0;
    max-height:42px;
    transition:max-height .4s cubic-bezier(.16,1,.3,1);
    position:relative;
    z-index:80;
  }
  .right-col.open{
    max-height:50vh;
    overflow-y:auto;
  }
  .right-col::-webkit-scrollbar{ width:3px; }

  .sheet-handle-wrap{ display:flex; }
  .sheet-label{ display:block; }
  .rh{ font-size:9px; padding:6px 14px 2px; }
  .mitem{ padding:8px 14px; }
  .mitem-icon{ width:32px; height:32px; border-radius:8px; }
  .mitem-title{ font-size:11px; }
  .mitem-sub{ font-size:9px; }

  /* dock shrinks and scrolls horizontally */
  .dock-wrap{ padding:6px 0 8px; }
  .dock-bar{ padding:6px 10px 8px; border-radius:16px; }
  .dlist{ gap:1px; font-size:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .dlist::-webkit-scrollbar{ display:none; }
  .di{ width:4.2em; }
  .di.hover{ width:6.4em; }
  .di.sc{ width:5.2em; }
  .di.sf{ width:4.6em; }
  .ddot{ margin-top:3px; }
  .dtt{ font-size:.75em; }
}
.dock-bar{
  padding:8px 12px 10px;
  border-radius:20px;
  background:light-dark(rgba(255,255,255,.88),rgba(18,18,18,.88));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid light-dark(rgba(0,0,0,.12),rgba(255,255,255,.1));
  box-shadow:0 4px 24px rgba(0,0,0,.15);
}
.dlist{display:flex;align-items:flex-end;list-style:none;padding:0;margin:0;gap:2px;font-size:clamp(8px,1vw,12px)}
.di{display:flex;flex-direction:column;align-items:center;width:4.8em;transition:width .4s cubic-bezier(.16,1,.3,1);position:relative}
.di.hover{width:7.4em}
.di.sc{width:6.2em}
.di.sf{width:5.5em}
.dl{display:flex;justify-content:center;align-items:flex-end;width:100%;padding:0 .4em;cursor:pointer;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.dl:hover{transform:translateY(-3px)}
.di.active .dl{transform:translateY(-5px)}
.dicon{width:100%;aspect-ratio:1;border-radius:22%;display:flex;align-items:center;justify-content:center;background:light-dark(#eeebe5,#2a2a2a);border:1px solid light-dark(rgba(0,0,0,.08),rgba(255,255,255,.08));overflow:hidden;transition:all .25s}
.di.active .dicon{background:rgba(249,129,46,.15);border-color:rgba(249,129,46,.35)}
.ddot{width:4px;height:4px;border-radius:50%;background:light-dark(#444,#ccc);margin:4px auto 0;opacity:0;transition:opacity .2s}
.di.active .ddot{opacity:1}
.dtt{background:light-dark(#1a1a1a,#f0f0f0);color:light-dark(#f0f0f0,#1a1a1a);opacity:0;white-space:nowrap;border-radius:7px;padding:.3em .6em;font-size:.85em;font-weight:500;transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .35s;position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px);pointer-events:none}
.di:hover .dtt{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

/* ── Categories for sidebar grouping ── */
const CATS=['Words & Names','Structure','Worship','Science','Biology'];

/* ── Build sidebar ── */
function buildList(activeKey){
  const el=document.getElementById('mlist');
  const wasOpen=el.classList.contains('open');
  el.innerHTML=`<div class="sheet-handle-wrap" id="sheetToggle"><div class="sheet-handle"></div></div><div class="sheet-label" id="sheetLabel">${wasOpen?'Tap a miracle below':'All Miracles'}</div>`;
  if(wasOpen) el.classList.add('open');
  document.getElementById('sheetToggle').addEventListener('click',()=>{
    const open=el.classList.toggle('open');
    document.getElementById('sheetLabel').textContent=open?'Tap a miracle below':'All Miracles';
  });
  CATS.forEach(cat=>{
    const items=M.filter(m=>m.cat===cat);
    if(!items.length) return;
    const hdr=document.createElement('div');
    hdr.className='rh';hdr.textContent=cat;
    el.appendChild(hdr);
    items.forEach(m=>{
      const li=document.createElement('div');
      li.className='mitem'+(m.key===activeKey?' active':'');
      li.dataset.key=m.key;
      li.innerHTML=`<div class="mitem-icon">${m.icon}</div><div class="mitem-text"><div class="mitem-title">${m.title} ${m.titleSpan}</div><div class="mitem-sub">${m.tag}</div></div>`;
      li.addEventListener('click',()=>{
        el.classList.remove('open');
        document.getElementById('sheetLabel').textContent='All Miracles';
        render(m.key);
      });
      el.appendChild(li);
    });
  });
}

/* ── Build dock ── */
function buildDock(activeKey){
  const el=document.getElementById('dock');
  el.innerHTML='';
  M.forEach((m,i)=>{
    const li=document.createElement('li');
    li.className='di'+(m.key===activeKey?' active':'');
    li.dataset.key=m.key;
    li.innerHTML=`<div class="dl"><div class="dicon"><svg width="52%" height="52%" viewBox="0 0 32 32"><text x="16" y="24" text-anchor="middle" font-size="14" font-family="serif,Poppins,sans-serif" fill="#F9812E">${m.dock}</text></svg></div></div><div class="ddot"></div><div class="dtt">${m.dockLabel}</div>`;
    li.querySelector('.dl').addEventListener('click',()=>render(m.key));
    li.addEventListener('mouseenter',()=>{
      li.classList.add('hover');
      const ls=el.querySelectorAll('.di');
      const idx=[...ls].indexOf(li);
      [[1,'sc'],[2,'sf'],[-1,'sc'],[-2,'sf']].forEach(([off,cls])=>{const s=ls[idx+off];if(s)s.classList.add(cls);});
    });
    li.addEventListener('mouseleave',()=>{
      li.classList.remove('hover');
      el.querySelectorAll('.di').forEach(d=>d.classList.remove('sc','sf'));
    });
    el.appendChild(li);
  });
}

/* ── Render card ── */
function getDivs(n){const r=[];for(let i=1;i<=9;i++)if(n%i===0)r.push(i);return r;}
function buildEq(eq){
  if(!eq||!eq.length)return '';
  return '<div class="eq">'+eq.map(t=>{
    if(t.op)return`<span class="eq-op">${t.op}</span>`;
    return`<div class="eq-t${t.r?' res':''}"><span class="eq-v">${t.v}</span><span class="eq-l">${t.l}</span></div>`;
  }).join('')+'</div>';
}

function render(key){
  const m=M.find(x=>x.key===key);
  if(!m)return;
  const divs=getDivs(m.check);
  const divHtml=divs.length
    ?`<p class="dlabel">Divisible by:</p><div class="dgrid">${divs.map(n=>`<div class="dc">${n}</div>`).join('')}</div>`
    :`<p class="dlabel" style="color:var(--p);margin-bottom:12px">Prime — divisible by 1 and ${m.check} only</p>`;
  const stats=m.stats.map(s=>`<div class="sp"><span class="n">${s.n}</span><span class="l">${s.l}</span></div>`).join('');

  document.getElementById('mcard').innerHTML=`
    <div class="mcard">
      <div class="mtag"><span class="dot"></span>${m.tag}</div>
      <div class="mnum"><span class="f">${m.f}</span>${m.r}</div>
      <p class="mav">${m.arabic}</p>
      <p class="mref">${m.ref}</p>
      <h1 class="mtitle">${m.title} <span>${m.titleSpan}</span></h1>
      <p class="mdesc">${m.desc}</p>
      ${buildEq(m.eq)}
      ${divHtml}
      <div class="stats">${stats}</div>
      <div class="quote">${m.quote}</div>
    </div>`;

  buildList(key);
  buildDock(key);
}

/* ── Sheet toggle ── */
const sheetToggle=document.getElementById('sheetToggle');
const mlistEl=document.getElementById('mlist');
const sheetLabel=document.getElementById('sheetLabel');
sheetToggle.addEventListener('click',()=>{
  const open=mlistEl.classList.toggle('open');
  sheetLabel.textContent=open?'Tap a miracle below':'All Miracles';
});

render('allah');
