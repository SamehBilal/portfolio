<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Pray — Every Salah — Sameh Bilal</title>
<link rel="apple-touch-icon" href="../assets/images/favicon.png">
<link rel="shortcut icon" type="image/png" href="../assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<style>
:root{
  --p:#F9812E;
  --sz:25px;
  --ln:color-mix(in lch,canvasText,transparent 70%);
  --bc:rgba(119,119,125,.2);
  --cord:color-mix(in lch,canvas,canvasText 75%);
  --stroke-v:color-mix(in lch,canvas,canvasText 75%);
  --shine:hsl(210 20% 80%/.75);
  --cap:color-mix(in lch,canvas,canvasText);
  --filament:light-dark(orange,color-mix(in lch,canvas,canvasText 25%));
  --bulb:transparent;
  --wf:24px;
  --dur:520ms;
}
[data-theme="light"]{color-scheme:light only}
[data-theme="dark"]{color-scheme:dark only}
html{color-scheme:light dark;height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Poppins",sans-serif;
  background:light-dark(#fff,#000);
  color:light-dark(#444,#e2e2e2);
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    linear-gradient(90deg,var(--ln) 1px,transparent 1px var(--sz)) 50%/var(--sz) var(--sz),
    linear-gradient(var(--ln) 1px,transparent 1px var(--sz)) 50%/var(--sz) var(--sz);
  -webkit-mask:linear-gradient(-20deg,transparent 50%,white);
  mask:linear-gradient(-20deg,transparent 50%,white);
  pointer-events:none;z-index:0;
}

/* ═══ HEADER ═══ */
header{
  flex-shrink:0;position:relative;z-index:100;
  display:flex;align-items:center;padding:16px 28px;gap:16px;
  background:light-dark(rgba(255,255,255,.9),rgba(0,0,0,.9));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--bc);
}
.logo{display:inline-block;font-size:2vmin;text-decoration:none;flex-shrink:0}
.ll{position:relative;display:block;float:left;width:3vmin;height:3vmin;border-top:.25vmin solid light-dark(#000,#fff);line-height:3vmin;text-align:center;color:light-dark(#000,#fff);transition:all .3s}
.ll::before{position:absolute;top:-.25vmin;right:-.25vmin;display:block;width:.25vmin;height:3vmin;background:var(--p);content:""}
.nav-mid{margin:0 auto;display:flex;gap:4px;list-style:none}
.nav-mid a{color:light-dark(#000,#fff);font-size:14px;font-weight:500;padding:6px 14px;text-decoration:none;border-radius:20px;transition:color .2s}
.nav-mid a:hover,.nav-mid a.cur{color:var(--p)}
@media(max-width:767px){.nav-mid{display:none}}
.hbtns{display:flex;align-items:center;gap:12px;flex-shrink:0}
.hire{background:var(--p);color:#fff;font-size:13px;font-weight:600;font-family:"Poppins",sans-serif;border-radius:14px;padding:9px 20px;text-decoration:none;transition:.3s;white-space:nowrap}
.hire:hover{background:#000}
.lform{position:relative;width:var(--wf);aspect-ratio:1;top:-1.2rem;z-index:9999}
.lform button{width:100%;aspect-ratio:1;position:absolute;top:0;left:0;z-index:3;background:transparent;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
.gh{width:24px;aspect-ratio:1;border-radius:50%;position:absolute;top:calc((24px*.175)+((24px*.65)*(125/48)));left:50%;translate:-50% -50%;z-index:9;outline:2px dashed canvasText!important;background:hsla(29,77%,59%,.25)}
.arr{position:absolute;left:-300%;top:200%;width:140%;container-type:inline-size;color:color-mix(in hsl,canvasText,#0000 40%)}
.arr svg{width:100%;scale:-1 -1}
.arr label{font-family:"Gloria Hallelujah",cursive;position:absolute;bottom:25%;rotate:8deg;font-size:18cqi;white-space:nowrap;top:50%;right:110%}
.ts{overflow:visible!important;position:absolute;width:65%;top:50%;left:50%;translate:-50% -50%}
.ts__cord{stroke:var(--cord);stroke-width:10;cursor:move}
.ts__cord:nth-of-type(1),.ts__cord:nth-of-type(2),.ts__cord:nth-of-type(3),.ts__cord:nth-of-type(4),.ts__cord:nth-of-type(5){display:none}
.ts__ce{stroke:var(--cord);fill:var(--cord)}.ts__dc{stroke-width:10;stroke:var(--cord)}
.bf{stroke:var(--filament);stroke-width:8}[data-theme='light'] .bf{stroke-width:12}
.bs{stroke:var(--shine)}.bb{stroke:var(--stroke-v);fill:var(--bulb);stroke-width:10}
.bc2{fill:var(--cap)}.bcs{fill:var(--shine)}.bco{stroke-width:10;stroke:var(--stroke-v)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ═══ LAYOUT ═══ */
.main{flex:1;display:flex;overflow:hidden;position:relative;z-index:1}

/* ─── LEFT ─── */
.left-col{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.pbar{height:3px;background:var(--bc);flex-shrink:0}
.pfill{height:100%;background:var(--p);transition:width var(--dur) cubic-bezier(.4,0,.2,1);width:0%}

.strip{padding:14px 40px 12px;flex-shrink:0;border-bottom:1px solid var(--bc);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.scounter{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:light-dark(#aaa,#555)}
.sbadge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:30px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(249,129,46,.1);color:var(--p);border:1px solid rgba(249,129,46,.3)}
.sbadge .dot{width:5px;height:5px;border-radius:50%;background:var(--p)}
.snametag{font-size:12px;font-weight:700;color:light-dark(#222,#e2e2e2);letter-spacing:.02em;margin-left:auto;display:flex;align-items:center;gap:7px}
.snametag .ar{direction:rtl;color:var(--p);font-weight:600}

.viewport{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:26px 40px;opacity:0;pointer-events:none;transform:translateY(40px);transition:opacity var(--dur) cubic-bezier(.4,0,.2,1),transform var(--dur) cubic-bezier(.4,0,.2,1)}
.panel.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.panel.leaving{opacity:0;transform:translateY(-40px);transition:opacity calc(var(--dur)*.55) ease,transform calc(var(--dur)*.55) ease}

.snum{font-size:clamp(50px,8vw,92px);font-weight:800;line-height:.85;color:transparent;-webkit-text-stroke:1.5px var(--p);letter-spacing:-.04em;margin-bottom:10px;user-select:none}
.snum .fill{color:var(--p);-webkit-text-stroke:0}
.sav{direction:rtl;font-size:17px;line-height:2;color:var(--p);font-weight:500;margin-bottom:3px}
.sref{font-size:11px;color:light-dark(#aaa,#666);margin-bottom:14px}
.stitle{font-size:clamp(18px,2.6vw,27px);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;color:light-dark(#000,#fff);margin-bottom:8px;line-height:1.2}
.stitle span{color:transparent;-webkit-text-stroke:1px light-dark(#000,#fff)}
.sdesc{font-size:13.5px;line-height:1.85;color:light-dark(#555,#a0aec0);max-width:480px;margin-bottom:14px}
.squote{padding:11px 15px;border-radius:12px;font-size:11.5px;font-style:italic;line-height:1.85;color:light-dark(#666,#b0b8c8);border:1px dashed rgba(249,129,46,.3);background:rgba(249,129,46,.04);max-width:480px}
.stip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 13px;border-radius:20px;font-size:11px;font-weight:600;background:light-dark(rgba(0,0,0,.04),rgba(255,255,255,.05));border:1px solid var(--bc);color:light-dark(#555,#aaa)}
.stip svg{width:13px;height:13px;flex-shrink:0;color:var(--p)}

.snav{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 40px 14px;border-top:1px solid var(--bc);gap:12px}
.nbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:14px;font-size:13px;font-weight:600;font-family:"Poppins",sans-serif;cursor:pointer;transition:.25s;border:1px solid var(--bc);background:light-dark(rgba(0,0,0,.03),rgba(255,255,255,.04));color:light-dark(#444,#ccc)}
.nbtn:hover{border-color:var(--p);color:var(--p)}
.nbtn:disabled{opacity:.3;cursor:default;pointer-events:none}
.nbtn.primary{background:var(--p);color:#fff;border-color:transparent}
.nbtn.primary:hover{background:#000}
.nbtn svg{width:14px;height:14px}
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}
.sdot{width:7px;height:7px;border-radius:50%;background:light-dark(rgba(0,0,0,.15),rgba(255,255,255,.15));cursor:pointer;transition:all .3s}
.sdot.active{background:var(--p);width:22px;border-radius:4px}
.sdot:hover:not(.active){background:rgba(249,129,46,.4)}

/* complete */
.complete{display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 40px;text-align:center;gap:12px}
.complete.show{display:flex;animation:ci .5s ease}
@keyframes ci{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.cicon{width:70px;height:70px;border-radius:50%;background:rgba(249,129,46,.12);border:2px solid rgba(249,129,46,.3);display:flex;align-items:center;justify-content:center}
.cicon svg{width:34px;height:34px;color:var(--p)}
.ctitle{font-size:clamp(20px,3vw,30px);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;color:light-dark(#000,#fff)}
.ctitle span{color:transparent;-webkit-text-stroke:1px var(--p)}
.cdesc{font-size:13.5px;line-height:1.9;color:light-dark(#666,#a0aec0);max-width:440px}
.cav{font-size:20px;direction:rtl;color:var(--p);font-weight:600;line-height:1.8}
.cref{font-size:11px;color:light-dark(#aaa,#666)}

/* ─── RIGHT ─── */
.right-col{width:42%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--bc);background:light-dark(rgba(249,129,46,.03),rgba(249,129,46,.04));overflow:hidden;position:relative}
.right-col::before{content:'';position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(249,129,46,.06);pointer-events:none}
.illo{position:relative;z-index:1;width:min(340px,78%);display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity var(--dur) ease,transform var(--dur) cubic-bezier(.4,0,.2,1)}
.illo.out{opacity:0;transform:scale(.86) translateY(16px)}
.illo.in{opacity:0;transform:scale(.86) translateY(-16px)}
.illo svg.mi{width:100%;height:auto}
.ilabel{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:light-dark(#888,#777);text-align:center}
.iav{font-size:20px;direction:rtl;color:var(--p);font-weight:600;text-align:center;line-height:1.6}

/* ═══ DOCK (prayer-type selector) ═══ */
.dock-wrap{flex-shrink:0;display:flex;justify-content:center;align-items:flex-end;padding:0 0 12px;position:relative;z-index:50}
.dock-bar{padding:8px 14px 10px;border-radius:22px;background:light-dark(rgba(255,255,255,.9),rgba(18,18,18,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid light-dark(rgba(0,0,0,.12),rgba(255,255,255,.1));box-shadow:0 4px 24px rgba(0,0,0,.15);max-width:calc(100vw - 24px)}
.dlist{display:flex;align-items:flex-end;list-style:none;padding:0;margin:0;gap:2px;font-size:clamp(8px,1vw,12px);overflow-x:auto;scrollbar-width:none}
.dlist::-webkit-scrollbar{display:none}
.di{display:flex;flex-direction:column;align-items:center;width:4.6em;transition:width .4s cubic-bezier(.16,1,.3,1);position:relative;flex-shrink:0}
.di.hover{width:7em}.di.sc{width:6em}.di.sf{width:5.3em}
.dl{display:flex;justify-content:center;align-items:flex-end;width:100%;padding:0 .35em;cursor:pointer;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.dl:hover{transform:translateY(-3px)}
.di.active .dl{transform:translateY(-5px)}
.dicon{width:100%;aspect-ratio:1;border-radius:24%;display:flex;align-items:center;justify-content:center;background:light-dark(#eeebe5,#2a2a2a);border:1px solid light-dark(rgba(0,0,0,.08),rgba(255,255,255,.08));overflow:hidden;transition:all .25s}
.dicon svg{width:60%;height:60%}
.di.active .dicon{background:rgba(249,129,46,.15);border-color:rgba(249,129,46,.4)}
.ddot{width:4px;height:4px;border-radius:50%;background:light-dark(#444,#ccc);margin:4px auto 0;opacity:0;transition:opacity .2s}
.di.active .ddot{opacity:1}
.dtt{background:light-dark(#1a1a1a,#f0f0f0);color:light-dark(#f0f0f0,#1a1a1a);opacity:0;white-space:nowrap;border-radius:7px;padding:.3em .6em;font-size:.85em;font-weight:500;transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .35s;position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px);pointer-events:none;z-index:5}
.di:hover .dtt{opacity:1;transform:translateX(-50%) translateY(0)}

/* Fard — bigger, always emphasised */
.di.fard{width:6.1em}
.di.fard.hover{width:7.6em}
.di.fard .dicon{background:rgba(249,129,46,.16);border:1.5px solid rgba(249,129,46,.5);box-shadow:0 0 0 3px rgba(249,129,46,.12),0 4px 14px rgba(249,129,46,.2)}
.di.fard .dl{transform:translateY(-6px)}
.di.fard.active .dl{transform:translateY(-8px)}
.fard-tag{position:absolute;top:-7px;right:-2px;font-size:.62em;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--p);padding:2px 5px;border-radius:20px;box-shadow:0 2px 6px rgba(249,129,46,.4);pointer-events:none}

/* ═══ MOBILE ═══ */
@media(max-width:767px){
  body{overflow:hidden}
  header{padding:10px 16px}
  .ll{width:5vmin;height:5vmin;line-height:5vmin;border-top-width:.4vmin}
  .ll::before{width:.4vmin;height:5vmin;top:-.4vmin;right:-.4vmin}
  .logo{font-size:3vmin}.lform{display:none}
  .main{flex-direction:column}
  .right-col{width:100%;height:180px;flex-shrink:0;border-left:none;border-bottom:1px solid var(--bc)}
  .right-col::before{width:130px}
  .illo{width:min(150px,64%);gap:8px}
  .iav{font-size:15px}.ilabel{font-size:9px}
  .left-col{flex:1;overflow:hidden}
  .strip{padding:9px 14px 7px}
  .snametag{font-size:11px}
  .panel{padding:12px 16px}
  .snum{font-size:clamp(38px,13vw,60px)}
  .sav{font-size:13px}.stitle{font-size:clamp(15px,4.5vw,20px)}
  .sdesc{font-size:11.5px;margin-bottom:9px}
  .squote{font-size:10.5px;padding:8px 11px}
  .stip{font-size:10px;padding:5px 10px}
  .snav{padding:9px 14px 11px}
  .nbtn{padding:8px 13px;font-size:12px}
  .dots{gap:4px}.sdot{width:6px;height:6px}.sdot.active{width:16px}
  .complete{padding:18px 14px;gap:8px}
  .ctitle{font-size:clamp(16px,5.5vw,24px)}.cdesc{font-size:11.5px}.cav{font-size:16px}
  .dock-wrap{padding:6px 0 8px}
  .dock-bar{padding:6px 10px 8px;border-radius:16px}
  .dlist{gap:1px;font-size:8px}
  .di{width:4.2em}.di.hover{width:6em}.di.sc{width:5em}.di.sf{width:4.5em}
  .di.fard{width:5.4em}.di.fard.hover{width:6.6em}
  .fard-tag{font-size:.55em}
}
</style>
</head>

        desc:'Say "Allahu Akbar" again, then recite the Salawat upon the Prophet ﷺ — the same Ibrahimiyyah blessings recited in the Tashahhud.',

        tip:'Send blessings on the Prophet ﷺ after the second Takbir.',
        iav:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّد',ilbl:'2nd Takbir — Salawat',draw:s=>s.innerHTML=figStand()+cap('Second Takbir, then Salawat')},
      {cat:'3rd Takbir',av:'الدُّعَاءُ لِلْمَيِّت',ref:'Hadith — Muslim 963',
        title:'Third Takbir:',titleSpan:'Du\'a for the Deceased',
        desc:'Say "Allahu Akbar", then make sincere du\'a for the deceased: "Allahumma ighfir lahu warhamhu wa \'afihi wa\'fu \'anhu" — O Allah, forgive him, have mercy on him, and pardon him.',

        tip:'Pray earnestly for the forgiveness of the deceased.',
        iav:'اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْه',ilbl:'3rd Takbir — du\'a for the deceased',draw:s=>s.innerHTML=dua()+cap('Du\'a of mercy for the deceased')},
      {cat:'4th Takbir',av:'التَّكْبِيرَةُ الرَّابِعَةُ وَالتَّسْلِيم',ref:'Sunnah of the Prophet ﷺ',
        title:'Fourth Takbir:',titleSpan:'Tasleem',
        desc:'Say "Allahu Akbar" a fourth time, pause briefly (a short du\'a may be added), then give the Tasleem to the right — and to the left — ending the prayer.',
        quote:'"Its closing is the Tasleem."',
        tip:'A brief pause, then Salam ends the funeral prayer.',
        iav:'السَّلَامُ عَلَيْكُم',ilbl:'4th Takbir — then Tasleem',draw:s=>s.innerHTML=rows()},

  /* 9 — TAHIYYATUL MASJID */
  {
    key:'masjid',en:'Greeting',ar:'تحية المسجد',

    steps:[
      {cat:'On Entering',av:'دُخُولُ الْمَسْجِد',ref:'Hadith — Bukhari 444',
        title:'When You',titleSpan:'Enter the Mosque',
        desc:'Whenever you enter a mosque, it is a confirmed Sunnah to greet it with two rak\'ahs before you sit down — a greeting to the house of Allah.',
        quote:'"When one of you enters the mosque, let him not sit until he prays two rak\'ahs." — Bukhari 444',
        tip:'Pray before you sit down.',
        iav:'إِذَا دَخَلَ أَحَدُكُمُ الْمَسْجِد',ilbl:'Greet the mosque on entering',draw:s=>s.innerHTML=mosque()},
      {cat:'Pray',av:'رَكْعَتَانِ خَفِيفَتَان',ref:'Hadith — Muslim 714',

/* ════════ State & rendering ════════ */
let curSalah=0, cur=0, busy=false;

function buildDock(){
  const el=document.getElementById('dock');el.innerHTML='';
  SALAH.forEach((m,i)=>{
    const li=document.createElement('li');
    li.className='di'+(m.fard?' fard':'')+(i===curSalah?' active':'');
    li.dataset.idx=i;
    li.innerHTML=`<div class="dl"><div class="dicon">${m.icon}</div></div>${m.fard?'<span class="fard-tag">Fard</span>':''}<div class="ddot"></div><div class="dtt">${m.dock}</div>`;
    li.querySelector('.dl').addEventListener('click',()=>selectSalah(i));
    li.addEventListener('mouseenter',()=>{
      li.classList.add('hover');
      const ls=el.querySelectorAll('.di');const idx=[...ls].indexOf(li);
      [[1,'sc'],[2,'sf'],[-1,'sc'],[-2,'sf']].forEach(([o,c])=>{const s=ls[idx+o];if(s)s.classList.add(c);});
    });
    li.addEventListener('mouseleave',()=>{li.classList.remove('hover');el.querySelectorAll('.di').forEach(d=>d.classList.remove('sc','sf'));});
    el.appendChild(li);
  });
}

function STEPS(){return SALAH[curSalah].steps;}

function buildPanels(){
  const vp=document.getElementById('vp');vp.innerHTML='';
  STEPS().forEach((s,i)=>{
    const p=document.createElement('div');
    p.className='panel'+(i===0?' active':'');p.id='p'+i;
    const n=String(i+1);
    p.innerHTML=`
      <div class="snum"><span class="fill">${n[0]}</span>${n.length>1?n[1]:''}</div>
      <p class="sav">${s.av}</p><p class="sref">${s.ref}</p>
      <h1 class="stitle">${s.title} <span>${s.titleSpan}</span></h1>
      <p class="sdesc">${s.desc}</p>
      <div class="squote">${s.quote}</div>
      <div class="stip">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        ${s.tip}
      </div>`;
    vp.appendChild(p);
  });
}

function buildDots(){
  const el=document.getElementById('dots');el.innerHTML='';
  STEPS().forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='sdot'+(i===cur?' active':'');
    d.addEventListener('click',()=>{if(!busy)goTo(i);});
    el.appendChild(d);
  });
}

function updateIllo(animate){
  const s=STEPS()[cur];const wrap=document.getElementById('illo');const svg=document.getElementById('mi');
  const set=()=>{s.draw(svg);document.getElementById('iav').textContent=s.iav;document.getElementById('ilbl').textContent=s.ilbl;};
  if(animate){
    wrap.classList.add('out');
    setTimeout(()=>{set();wrap.classList.remove('out');wrap.classList.add('in');
      requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.remove('in')));},220);
  } else set();
}

function updateUI(){
  const m=SALAH[curSalah], s=STEPS()[cur], total=STEPS().length;
  document.getElementById('sc').textContent=`Step ${cur+1} of ${total}`;
  document.getElementById('scat').textContent=s.cat;
  document.getElementById('snameEn').textContent=m.en;
  document.getElementById('snameAr').textContent=m.ar;
  document.getElementById('pf').style.width=`${((cur+1)/total)*100}%`;
  document.getElementById('pb').disabled=cur===0;
  const nb=document.getElementById('nb');
  nb.innerHTML=(cur===total-1)
    ?'Finish <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>'
    :'Next <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="14" height="14" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  buildDots();updateIllo(true);
}

function goTo(next){
  if(busy)return;
  const total=STEPS().length;
  if(next===total){showComplete();return;}
  if(next<0||next>=total)return;
  busy=true;
  const op=document.getElementById('p'+cur), np=document.getElementById('p'+next);
  op.classList.add('leaving');op.classList.remove('active');
  updateIllo(true);
  setTimeout(()=>{
    op.classList.remove('leaving');cur=next;
    np.style.transform='translateY(40px)';np.style.opacity='0';np.classList.add('active');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{np.style.transform='';np.style.opacity='';}));
    updateUI();busy=false;
  },300);
}
function next(){const t=STEPS().length;cur===t-1?showComplete():goTo(cur+1);}
function prev(){goTo(cur-1);}

function showComplete(){
  const m=SALAH[curSalah];
  document.getElementById('vp').style.display='none';
  document.getElementById('nav').style.display='none';
  document.querySelector('.strip').style.display='none';
  document.getElementById('pf').style.width='100%';
  document.getElementById('cnameEn').textContent=m.en;
  document.getElementById('comp').classList.add('show');
  const svg=document.getElementById('mi');
  document.getElementById('iav').textContent='تَقَبَّلَ اللَّهُ';
  document.getElementById('ilbl').textContent='May Allah accept it from you';
  svg.innerHTML=`
    <circle cx="160" cy="160" r="88" fill="${P}0a" stroke="${P}" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="160" cy="160" r="58" fill="${P}12" stroke="${P}" stroke-width="2"/>
    <path d="M132 160 L150 178 L190 134" stroke="${P}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="160" y="288" text-anchor="middle" font-family="serif" font-size="15" fill="${P}" opacity=".8">تَقَبَّلَ اللَّهُ</text>`;
}

function selectSalah(i){
  curSalah=i;cur=0;busy=false;
  document.getElementById('vp').style.display='';
  document.getElementById('nav').style.display='';
  document.querySelector('.strip').style.display='';
  document.getElementById('comp').classList.remove('show');
  buildPanels();buildDots();updateUI();buildDock();
}

document.getElementById('nb').addEventListener('click',next);
document.getElementById('pb').addEventListener('click',prev);
document.getElementById('againBtn').addEventListener('click',()=>selectSalah(curSalah));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')next();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')prev();
});

/* swipe on left col */
let tx=0,ty=0;
const lc=document.querySelector('.left-col');
lc.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
lc.addEventListener('touchend',e=>{
  const dy=ty-e.changedTouches[0].clientY, dx=tx-e.changedTouches[0].clientX;
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>40){dy>0?next():prev();}
},{passive:true});

/* init */
buildDock();selectSalah(0);
</script>
