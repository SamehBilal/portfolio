<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            --stripe-color1: #d22f47;
            --stripe-color2: #315f9b;
            --stripe-width: 2.4rem;

            --bg-color: #eee6d3;

            height: 100dvh;
            margin: 0;

            border-image-source: repeating-linear-gradient(142deg,
                    var(--stripe-color1) 0px 30px,
                    transparent 30px 50px,
                    var(--stripe-color2) 50px 80px,
                    transparent 80px 100px);
            border-image-slice: 40;
            border-image-width: var(--stripe-width);

            background-color: var(--bg-color);
        }
    </style>
</head>
