<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  
<!-- ============================================================
     Azkar — Morning & Evening Remembrance
     Portfolio theme: #F9812E · Poppins · light-dark()
     Features: tasbih counter · pin-to-continue (persists) ·
               morning/evening reminders · voice (Arabic TTS)
     ============================================================ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#F9812E;
  --primary-soft:rgba(249,129,46,.10);
  --primary-ring:rgba(249,129,46,.45);
  --grid:color-mix(in lch, canvasText, transparent 80%);
  --size:25px;
  color-scheme:light dark;
}
[data-theme="light"]{color-scheme:light only;}
[data-theme="dark"]{color-scheme:dark only;}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:"Poppins",sans-serif;
  color:light-dark(#444,#e2e2e2);
  background:light-dark(#fff,#0a0a0a);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* grid backdrop like the portfolio */
body::before{
  content:'';position:fixed;inset:0;height:75vh;width:100vw;z-index:-1;pointer-events:none;
  background:
    linear-gradient(90deg,var(--grid) 1px,transparent 1px var(--size)) 50% 0/var(--size) var(--size),
    linear-gradient(var(--grid) 1px,transparent 1px var(--size)) 50% 0/var(--size) var(--size);
  -webkit-mask:linear-gradient(-20deg,transparent 45%,#000);
  mask:linear-gradient(-20deg,transparent 45%,#000);
}

.wrap{max-width:760px;margin:0 auto;padding:18px 16px 120px;}

/* ── header ── */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.brand{display:flex;flex-direction:column;line-height:1.1;}
.brand .ar{font-family:"Amiri",serif;font-size:26px;font-weight:700;color:light-dark(#111,#fff);}
.brand .en{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;font-weight:600;margin-top:2px;}
.spacer{flex:1;}
.icon-btn{
  width:42px;height:42px;border-radius:13px;cursor:pointer;display:grid;place-items:center;
  background:light-dark(#fff,#161616);border:1px solid light-dark(rgba(0,0,0,.08),rgba(255,255,255,.10));
  color:light-dark(#333,#ddd);transition:.25s;
}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px);}
.icon-btn svg{width:20px;height:20px;}

/* ── reminder banner ── */
.banner{
  display:none;align-items:center;gap:12px;margin-bottom:14px;padding:13px 16px;border-radius:15px;
  background:var(--primary-soft);border:1px solid var(--primary-ring);color:light-dark(#7a3d10,#ffc89c);
  font-size:13.5px;font-weight:500;
}
.banner.show{display:flex;}
.banner svg{width:20px;height:20px;flex-shrink:0;color:var(--primary);}
.banner b{color:var(--primary);}
.banner button{margin-inline-start:auto;background:var(--primary);color:#fff;border:0;border-radius:9px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;}

/* ── segmented control ── */
.seg{
  display:flex;gap:6px;padding:6px;border-radius:16px;margin-bottom:14px;
  background:light-dark(#f4f4f5,#141414);border:1px solid light-dark(rgba(0,0,0,.06),rgba(255,255,255,.08));
}
.seg button{
  flex:1;border:0;background:transparent;cursor:pointer;font:inherit;font-weight:600;font-size:14px;
  padding:11px;border-radius:11px;color:light-dark(#777,#999);transition:.25s;display:flex;
  align-items:center;justify-content:center;gap:7px;
}
.seg button .ar{font-family:"Amiri",serif;font-size:17px;}
.seg button.active{background:var(--primary);color:#fff;box-shadow:0 4px 14px -4px var(--primary-ring);}

/* ── progress ── */
.progress{margin-bottom:18px;}
.progress .meta{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:7px;opacity:.7;}
.progress .meta b{color:var(--primary);}
.bar{height:8px;border-radius:99px;background:light-dark(#eee,#1c1c1c);overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),#ffb070);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);}

/* ── card ── */
.card{
  position:relative;border-radius:20px;padding:18px 18px 14px;margin-bottom:14px;
  background:light-dark(#fff,#141414);
  border:1px solid light-dark(rgba(0,0,0,.07),rgba(255,255,255,.08));
  box-shadow:light-dark(0 2px 10px rgba(0,0,0,.03),0 2px 10px rgba(0,0,0,.25));
  transition:border-color .3s,box-shadow .3s,opacity .3s,transform .2s;
  scroll-margin-top:80px;
}
.card.pinned{
  border-color:var(--primary);
  box-shadow:0 0 0 2px var(--primary-ring),0 10px 28px -10px var(--primary-ring);
}
.card.done{opacity:.5;}
.card.done .arabic{text-decoration:line-through;text-decoration-color:var(--primary-ring);text-decoration-thickness:2px;}

.card .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.card .num{
  flex-shrink:0;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:var(--primary-soft);color:var(--primary);
}
.card .tools{margin-inline-start:auto;display:flex;gap:6px;}
.tool{
  width:34px;height:34px;border-radius:10px;border:1px solid light-dark(rgba(0,0,0,.08),rgba(255,255,255,.10));
  background:transparent;color:light-dark(#666,#aaa);cursor:pointer;display:grid;place-items:center;transition:.2s;
}
.tool:hover{border-color:var(--primary);color:var(--primary);}
.tool svg{width:17px;height:17px;}
.tool.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.pin-flag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);display:none;align-self:center;}
.card.pinned .pin-flag{display:inline;}

.arabic{
  font-family:"Amiri","Noto Naskh Arabic",serif;
  direction:rtl;text-align:right;line-height:2.05;color:light-dark(#1a1a1a,#f4f4f4);
  font-size:var(--ar-size,24px);font-weight:700;margin-bottom:10px;
}
.translit{font-size:13px;font-style:italic;opacity:.65;margin-bottom:6px;direction:ltr;}
.translation{font-size:13.5px;line-height:1.55;opacity:.8;margin-bottom:14px;}
.hideT .translit,.hideT .translation{display:none;}

/* counter row */
.counter{display:flex;align-items:center;gap:14px;}
.tap{
  flex:1;border:0;cursor:pointer;font:inherit;border-radius:14px;padding:14px;font-weight:600;font-size:14px;
  background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-ring);
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .08s,background .2s;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.tap:active{transform:scale(.97);}
.tap.complete{background:var(--primary);color:#fff;cursor:default;}
.tap svg{width:18px;height:18px;}
.ring{position:relative;width:58px;height:58px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);width:58px;height:58px;}
.ring .track{fill:none;stroke:light-dark(#eee,#222);stroke-width:5;}
.ring .fill{fill:none;stroke:var(--primary);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .35s;}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;color:light-dark(#222,#eee);}
.ring .val small{font-size:9px;opacity:.55;}

/* ── footer bar ── */
.dock{
  position:fixed;left:50%;bottom:18px;translate:-50% 0;display:flex;gap:8px;padding:8px;border-radius:99px;z-index:30;
  background:light-dark(#fff,#161616);border:1px solid light-dark(rgba(0,0,0,.10),rgba(255,255,255,.12));
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.dock button{
  border:0;background:transparent;color:light-dark(#555,#bbb);cursor:pointer;font:inherit;font-size:12px;font-weight:600;
  padding:8px 14px;border-radius:99px;display:flex;align-items:center;gap:6px;transition:.2s;
}
.dock button:hover{background:var(--primary-soft);color:var(--primary);}
.dock button svg{width:17px;height:17px;}
.dock .sep{width:1px;background:light-dark(rgba(0,0,0,.1),rgba(255,255,255,.12));margin:4px 0;}

/* ── modal ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:40;display:none;align-items:flex-end;justify-content:center;}
.scrim.show{display:flex;}
.sheet{
  width:100%;max-width:480px;background:light-dark(#fff,#141414);border-radius:24px 24px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));border:1px solid light-dark(rgba(0,0,0,.08),rgba(255,255,255,.10));
  animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow:auto;
}
@keyframes up{from{transform:translateY(100%);}}
.sheet h3{font-size:18px;color:light-dark(#111,#fff);margin-bottom:4px;}
.sheet .sub{font-size:12.5px;opacity:.6;margin-bottom:18px;}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid light-dark(rgba(0,0,0,.06),rgba(255,255,255,.07));}
.field:last-of-type{border-bottom:0;}
.field label{font-size:13.5px;font-weight:500;}
.field label small{display:block;font-size:11px;opacity:.55;font-weight:400;margin-top:2px;}
.field input[type=time]{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid light-dark(rgba(0,0,0,.12),rgba(255,255,255,.14));background:transparent;color:inherit;}
.field input[type=range]{accent-color:var(--primary);width:130px;}
/* switch */
.sw{position:relative;width:46px;height:26px;flex-shrink:0;}
.sw input{opacity:0;width:0;height:0;}
.sw span{position:absolute;inset:0;border-radius:99px;background:light-dark(#ddd,#333);cursor:pointer;transition:.25s;}
.sw span::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.25s;}
.sw input:checked + span{background:var(--primary);}
.sw input:checked + span::before{transform:translateX(20px);}
.sheet .close{width:100%;margin-top:18px;border:0;background:var(--primary);color:#fff;font:inherit;font-weight:600;padding:13px;border-radius:13px;cursor:pointer;}

.foot{text-align:center;font-size:11.5px;opacity:.45;margin-top:26px;}
.foot a{color:var(--primary);text-decoration:none;}
.toast{
  position:fixed;left:50%;bottom:90px;translate:-50% 0;background:light-dark(#111,#fff);color:light-dark(#fff,#111);
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:50;opacity:0;pointer-events:none;transition:.3s;
}
.toast.show{opacity:1;translate:-50% -6px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <span class="ar">الأذكار</span>
      <span class="en">Morning &amp; Evening</span>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="banner" id="banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span id="bannerText"></span>
    <button id="bannerGo">Go</button>
  </div>

  <div class="seg">
    <button data-session="morning" class="active"><span class="ar">أذكار الصباح</span> Morning</button>
    <button data-session="evening"><span class="ar">أذكار المساء</span> Evening</button>
  </div>

  <div class="progress">
    <div class="meta"><span>Completed</span><span><b id="pDone">0</b> / <span id="pTotal">0</span></span></div>
    <div class="bar"><i id="pBar"></i></div>
  </div>

  <div id="list"></div>

  <div class="foot">
    Built for the portfolio of <a href="https://samehbilal.github.io/portfolio" target="_blank" rel="noopener">Sameh Bilal</a> · تقبّل الله
  </div>
</div>

<!-- dock -->
<div class="dock">
  <button id="continueBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    Continue
  </button>
  <div class="sep"></div>
  <button id="resetBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    Reset
  </button>
</div>

<!-- settings -->
<div class="scrim" id="scrim">
  <div class="sheet">
    <h3>Settings</h3>
    <p class="sub">Reminders, display &amp; voice</p>

    <div class="field">
      <label>Morning reminder<small>Notify me for morning adhkar</small></label>
      <input type="time" id="morningTime" value="06:00">
    </div>
    <div class="field">
      <label>Evening reminder<small>Notify me for evening adhkar</small></label>
      <input type="time" id="eveningTime" value="17:00">
    </div>
    <div class="field">
      <label>Enable notifications<small>While the app is open in this tab</small></label>
      <div class="sw"><input type="checkbox" id="notif"><span></span></div>
    </div>
    <div class="field">
      <label>Show translation<small>Transliteration &amp; meaning</small></label>
      <div class="sw"><input type="checkbox" id="showT" checked><span></span></div>
    </div>
    <div class="field">
      <label>Auto-reset daily<small>Fresh counts each new day</small></label>
      <div class="sw"><input type="checkbox" id="autoReset" checked><span></span></div>
    </div>
    <div class="field">
      <label>Arabic text size</label>
      <input type="range" id="arSize" min="18" max="34" value="24">
    </div>
    <div class="field">
      <label>Voice speed</label>
      <input type="range" id="rate" min="0.5" max="1.2" step="0.1" value="0.8">
    </div>

    <button class="close" id="closeSheet">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ── storage that won't crash if localStorage is blocked ── */
  const mem = {};
  const store = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return (k in mem)?mem[k]:d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } }
  };
  const today = () => new Date().toISOString().slice(0,10);

  /* ============================================================
     AZKAR DATA  (authentic morning/evening remembrances)
     fields: id, ar, tr (transliteration), en (meaning), count
     ============================================================ */
  const QULS = [
    {id:'ikhlas', ar:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ',
     tr:'Surah Al-Ikhlas', en:'Say, He is Allah, the One… (Surah 112).', count:3},
    {id:'falaq', ar:'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ',
     tr:'Surah Al-Falaq', en:'Say, I seek refuge in the Lord of daybreak… (Surah 113).', count:3},
    {id:'nas', ar:'قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',
     tr:'Surah An-Nas', en:'Say, I seek refuge in the Lord of mankind… (Surah 114).', count:3},
  ];

  const KURSI = {id:'kursi',
    ar:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ',
    tr:'Ayat al-Kursi', en:'The Throne Verse (2:255) — protection upon reciting it morning and evening.', count:1};

  const SHARED_TAIL = [
    {id:'sayyid', count:1, tr:'Sayyid al-Istighfar',
     ar:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',
     en:'The chief supplication for seeking forgiveness.'},
    {id:'radhitu', count:3, tr:'Radhitu billahi…',
     ar:'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا',
     en:'I am pleased with Allah as Lord, Islam as religion, and Muhammad ﷺ as Prophet.'},
    {id:'hasbi', count:7, tr:'Hasbiyallah… (×7)',
     ar:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',
     en:'Allah is sufficient for me; there is no god but Him. In Him I trust, Lord of the Mighty Throne.'},
    {id:'bismillah', count:3, tr:'Bismillahilladhi… (×3)',
     ar:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',
     en:'In the name of Allah, with whose name nothing on earth or in heaven can cause harm.'},
    {id:'afini', count:3, tr:'Allahumma ʿafini… (×3)',
     ar:'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ',
     en:'O Allah, grant my body health, my hearing health, my sight health. There is no god but You.'},
    {id:'subhan100', count:100, tr:'SubhanAllahi wa bihamdihi (×100)',
     ar:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',
     en:'Glory and praise to Allah — whoever says it 100× has sins forgiven though like sea foam.'},
    {id:'tahlil', count:10, tr:'La ilaha illa Allah… (×10)',
     ar:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
     en:'None has the right to be worshipped but Allah alone, with no partner; His is the dominion and praise, and He is over all things capable.'},
    {id:'istighfar', count:100, tr:'Astaghfirullah (×100)',
     ar:'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ',
     en:'I seek Allah’s forgiveness and turn to Him in repentance.'},
    {id:'salah', count:10, tr:'Salah upon the Prophet ﷺ (×10)',
     ar:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ',
     en:'O Allah, send prayers and peace upon our Prophet Muhammad ﷺ.'},
  ];

  const MORNING = [
    KURSI, ...QULS,
    {id:'asbahna', count:1, tr:'Asbahna…',
     ar:'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
     en:'We have reached the morning and the dominion belongs to Allah…'},
    {id:'asbahna-fitrah', count:1, tr:'Asbahna ʿala fitrah…',
     ar:'أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ',
     en:'We rise upon the natural religion of Islam…'},
    {id:'bika-asbahna', count:1, tr:'Allahumma bika asbahna…',
     ar:'اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ',
     en:'O Allah, by You we enter the morning and the evening, by You we live and die, and to You is the resurrection.'},
    ...SHARED_TAIL,
  ];

  const EVENING = [
    KURSI, ...QULS,
    {id:'amsayna', count:1, tr:'Amsayna…',
     ar:'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',
     en:'We have reached the evening and the dominion belongs to Allah…'},
    {id:'amsayna-fitrah', count:1, tr:'Amsayna ʿala fitrah…',
     ar:'أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ',
     en:'We reach evening upon the natural religion of Islam…'},
    {id:'bika-amsayna', count:1, tr:'Allahumma bika amsayna…',
     ar:'اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ',
     en:'O Allah, by You we enter the evening and the morning, by You we live and die, and to You is the return.'},
    ...SHARED_TAIL,
  ];

  const DATA = { morning: MORNING, evening: EVENING };

  /* ── state ── */
  let settings = Object.assign({
    morningTime:'06:00', eveningTime:'17:00', notif:false,
    showT:true, autoReset:true, arSize:24, rate:0.8, theme:null
  }, store.get('azkar.settings',{}));

  let counts   = store.get('azkar.counts',{morning:{},evening:{}});
  let bookmark = store.get('azkar.bookmark',{});      // {session,id}
  let session  = store.get('azkar.session','morning');

  /* daily auto-reset */
  if(settings.autoReset && store.get('azkar.lastReset','') !== today()){
    counts = {morning:{},evening:{}};
    store.set('azkar.counts',counts);
    store.set('azkar.lastReset',today());
  }

  /* ── theme ── */
  if(settings.theme) document.documentElement.dataset.theme = settings.theme;
  document.getElementById('themeBtn').onclick = ()=>{
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const next = cur==='dark'?'light':'dark';
    document.documentElement.dataset.theme = next;
    settings.theme = next; saveSettings();
  };

  /* ── DOM refs ── */
  const list = document.getElementById('list');
  const pBar = document.getElementById('pBar');
  const pDone = document.getElementById('pDone');
  const pTotal = document.getElementById('pTotal');
  const toastEl = document.getElementById('toast');

  function saveSettings(){ store.set('azkar.settings',settings); }
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),1600); }
  document.documentElement.style.setProperty('--ar-size', settings.arSize+'px');

  /* ── render ── */
  function render(){
    const items = DATA[session];
    list.innerHTML = '';
    list.classList.toggle('hideT', !settings.showT);

    items.forEach((z,i)=>{
      const cur = counts[session][z.id] || 0;
      const done = cur >= z.count;
      const pinned = bookmark.session===session && bookmark.id===z.id;

      const card = document.createElement('div');
      card.className = 'card' + (done?' done':'') + (pinned?' pinned':'');
      card.id = 'z-'+z.id;
      if(!settings.showT) card.classList.add('hideT');

      const C=2*Math.PI*24, off=C*(1-Math.min(cur/z.count,1));

      card.innerHTML = `
        <div class="hd">
          <span class="num">${i+1}</span>
          <span class="pin-flag">↩ continue here</span>
          <div class="tools">
            <button class="tool spk" title="Read aloud" aria-label="Read aloud">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
            </button>
            <button class="tool pin ${pinned?'on':''}" title="Pin to continue" aria-label="Pin">
              <svg viewBox="0 0 24 24" fill="${pinned?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
          </div>
        </div>
        <div class="arabic">${z.ar}</div>
        <div class="translit">${z.tr}</div>
        <div class="translation">${z.en}</div>
        <div class="counter">
          <button class="tap ${done?'complete':''}">
            ${done
              ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Completed'
              : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg> Tap to count'}
          </button>
          <div class="ring">
            <svg viewBox="0 0 58 58"><circle class="track" cx="29" cy="29" r="24"/><circle class="fill" cx="29" cy="29" r="24" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
            <div class="val">${cur}<small>/${z.count}</small></div>
          </div>
        </div>`;

      // tap to count
      card.querySelector('.tap').addEventListener('click', ()=>{
        const c = counts[session][z.id]||0;
        if(c>=z.count) return;
        counts[session][z.id] = c+1;
        store.set('azkar.counts',counts);
        // remember position automatically as you go
        bookmark = {session, id:z.id}; store.set('azkar.bookmark',bookmark);
        if(navigator.vibrate) navigator.vibrate(12);
        render();
      });

      // pin
      card.querySelector('.pin').addEventListener('click',(e)=>{
        e.stopPropagation();
        if(bookmark.session===session && bookmark.id===z.id){ bookmark={}; toast('Unpinned'); }
        else { bookmark={session,id:z.id}; toast('Pinned — you can continue here later'); }
        store.set('azkar.bookmark',bookmark);
        render();
      });

      // speak
      card.querySelector('.spk').addEventListener('click',(e)=>{ e.stopPropagation(); speak(z.ar, e.currentTarget); });

      list.appendChild(card);
    });

    updateProgress();
  }

  function updateProgress(){
    const items = DATA[session];
    const done = items.filter(z => (counts[session][z.id]||0) >= z.count).length;
    pDone.textContent = done;
    pTotal.textContent = items.length;
    pBar.style.width = (done/items.length*100)+'%';
  }

  /* ── session switch ── */
  document.querySelectorAll('.seg button').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      session = b.dataset.session; store.set('azkar.session',session);
      render();
    };
  });
  document.querySelector(`.seg button[data-session="${session}"]`).click();

  /* ── continue / reset ── */
  document.getElementById('continueBtn').onclick = ()=>{
    if(!bookmark.id){ toast('Nothing pinned yet — tap the 🔖 on a zikr'); return; }
    if(bookmark.session!==session) document.querySelector(`.seg button[data-session="${bookmark.session}"]`).click();
    const el = document.getElementById('z-'+bookmark.id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); flash(el); }
  };
  document.getElementById('resetBtn').onclick = ()=>{
    counts[session] = {};
    store.set('azkar.counts',counts);
    store.set('azkar.lastReset',today());
    render();
    toast('Counts reset for this session');
  };
  function flash(el){ el.style.transition='box-shadow .3s'; el.classList.add('pinned'); setTimeout(()=>render(),700); }

  /* ============================================================
     VOICE  (Web Speech API — Arabic)
     ============================================================ */
  let voices = [];
  let speaking = null;
  function loadVoices(){ voices = speechSynthesis.getVoices(); }
  loadVoices();
  if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;

  function arabicVoice(){
    return voices.find(v=>/ar([-_]|$)/i.test(v.lang)) || null;
  }
  function speak(text, btn){
    if(!('speechSynthesis' in window)){ toast('Voice not supported on this browser'); return; }
    // toggle off if same one is talking
    if(speaking){ speechSynthesis.cancel(); speaking=null; if(btn) btn.classList.remove('on'); return; }
    const v = arabicVoice();
    if(!v){ toast('No Arabic voice installed on this device'); }
    const u = new SpeechSynthesisUtterance(text.replace(/[۝]/g,'، '));
    if(v) u.voice = v;
    u.lang = v ? v.lang : 'ar-SA';
    u.rate = settings.rate;
    u.onend = ()=>{ speaking=null; if(btn) btn.classList.remove('on'); };
    speaking = u;
    if(btn) btn.classList.add('on');
    speechSynthesis.speak(u);
  }

  /* ============================================================
     SETTINGS SHEET
     ============================================================ */
  const scrim = document.getElementById('scrim');
  const $ = id => document.getElementById(id);
  $('settingsBtn').onclick = ()=>{
    $('morningTime').value = settings.morningTime;
    $('eveningTime').value = settings.eveningTime;
    $('notif').checked = settings.notif;
    $('showT').checked = settings.showT;
    $('autoReset').checked = settings.autoReset;
    $('arSize').value = settings.arSize;
    $('rate').value = settings.rate;
    scrim.classList.add('show');
  };
  $('closeSheet').onclick = ()=>scrim.classList.remove('show');
  scrim.onclick = (e)=>{ if(e.target===scrim) scrim.classList.remove('show'); };

  $('morningTime').onchange = e=>{ settings.morningTime=e.target.value; saveSettings(); };
  $('eveningTime').onchange = e=>{ settings.eveningTime=e.target.value; saveSettings(); };
  $('showT').onchange = e=>{ settings.showT=e.target.checked; saveSettings(); render(); };
  $('autoReset').onchange = e=>{ settings.autoReset=e.target.checked; saveSettings(); };
  $('arSize').oninput = e=>{ settings.arSize=+e.target.value; document.documentElement.style.setProperty('--ar-size',settings.arSize+'px'); saveSettings(); };
  $('rate').oninput = e=>{ settings.rate=+e.target.value; saveSettings(); };
  $('notif').onchange = async e=>{
    if(e.target.checked){
      if(!('Notification' in window)){ toast('Notifications not supported'); e.target.checked=false; return; }
      const perm = await Notification.requestPermission();
      if(perm!=='granted'){ toast('Permission denied'); e.target.checked=false; return; }
      toast('Reminders on (while the app is open)');
    }
    settings.notif = e.target.checked; saveSettings();
  };

  /* ============================================================
     REMINDERS
     - time-aware banner (always)
     - browser notification at set times (while tab is open)
     NOTE: background alerts when the app is fully closed require
     a Service Worker + Push subscription. Hook left below.
     ============================================================ */
  function timeAwareBanner(){
    const h = new Date().getHours();
    const banner = $('banner'), txt = $('bannerText'), go = $('bannerGo');
    let target=null;
    if(h>=4 && h<11) target='morning';
    else if(h>=15 && h<20) target='evening';
    if(!target){ banner.classList.remove('show'); return; }
    const allDone = DATA[target].every(z=>(counts[target][z.id]||0)>=z.count);
    if(allDone){ banner.classList.remove('show'); return; }
    txt.innerHTML = target==='morning'
      ? `It’s morning — time for <b>أذكار الصباح</b>.`
      : `It’s evening — time for <b>أذكار المساء</b>.`;
    go.onclick = ()=>{ document.querySelector(`.seg button[data-session="${target}"]`).click(); banner.classList.remove('show'); window.scrollTo({top:0,behavior:'smooth'}); };
    banner.classList.add('show');
  }

  function checkReminder(){
    if(!settings.notif || !('Notification' in window) || Notification.permission!=='granted') return;
    const now = new Date();
    const hhmm = now.toTimeString().slice(0,5);
    const stamp = today();
    const fired = store.get('azkar.fired',{});
    [['morning',settings.morningTime,'أذكار الصباح'],['evening',settings.eveningTime,'أذكار المساء']]
      .forEach(([ses,t,label])=>{
        const key = ses+'-'+stamp;
        if(hhmm===t && !fired[key]){
          fired[key]=true; store.set('azkar.fired',fired);
          try{
            const n = new Notification('Time for '+label, {
              body: ses==='morning'?'Begin your morning remembrance 🌅':'Begin your evening remembrance 🌙',
              tag:'azkar-'+ses
            });
            n.onclick = ()=>{ window.focus(); document.querySelector(`.seg button[data-session="${ses}"]`).click(); };
          }catch(e){}
        }
      });
  }

  timeAwareBanner();
  checkReminder();
  setInterval(()=>{ checkReminder(); }, 30000);
  setInterval(timeAwareBanner, 5*60000);

  /* on load: jump to the pinned zikr so you continue where you left off */
  if(bookmark.id){
    setTimeout(()=>{
      if(bookmark.session!==session) document.querySelector(`.seg button[data-session="${bookmark.session}"]`).click();
      const el = document.getElementById('z-'+bookmark.id);
      if(el) el.scrollIntoView({block:'center'});
    }, 250);
  }

  /* ── OPTIONAL: true background reminders ──────────────────────
     For notifications when the app is fully closed, register a
     service worker on your domain and use the Notification
     Triggers / Push API. Example skeleton to add to sw.js:

       self.addEventListener('periodicsync', e => { ... show notification ... });

     and here:
       if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
     ----------------------------------------------------------- */

})();
</script>

</body>
</html>
