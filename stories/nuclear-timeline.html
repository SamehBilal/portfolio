        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 24px 16px;
            background: #000;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(9px, 1.8vw, 16px);

        .back {
            position: fixed;
            top: 16px;
            left: 16px;
            color: #aaa;
            text-decoration: none;
            font-size: 10px;
            letter-spacing: .05em;
        }

            text-align: center;
            line-height: 1.6;

        .bar {
            display: flex;
            align-items: center;
            gap: .5em 1.5em;
            flex-wrap: wrap;
            min-height: 2.5em;
            padding: .6em 0;
        }

        .bar .push { margin-left: auto; }

        #stage {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 1;
            height: auto;
            background-image: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/49914/bkg_1.png');
            background-size: contain;
            background-repeat: no-repeat;
        }

        .score {
            font-size: .7em;
            opacity: 0;
            transition: opacity 1s;
            white-space: nowrap;
        }

        .score.active { opacity: 1; }

        /* Flags from https://tayles.tumblr.com/post/321497631/flags-css-sprite */
        .score:before {
            display: inline-block;
            content: "";
            width: 16px;
            height: 11px;
            background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/49914/flags_sprite.png) no-repeat;
            margin-right: .5ex;
            vertical-align: -1px;
        }

        #US { color: #ccf; }
        #CP { color: #fcc; }
        #GB { color: #fcf; }
        #FR { color: #cfc; }
        #PC, #IN, #IS { color: #fff; }

        #US:before { background-position: -64px -187px; }
        #CP:before { background-position: -48px -319px; }
        #GB:before { background-position: -16px -275px; }
        #FR:before { background-position: -16px -253px; }
        #PC:before { background-position: 0 -506px; }
        #IN:before { background-position: -16px -561px; }
        #IS:before { background-position: -16px -550px; }

        #total:after, .score:after { content: attr(data-score); }

        #time { white-space: nowrap; }

        #time:before {
            content: attr(data-month);
            font-size: .7em;
            margin-right: 1em;
            vertical-align: middle;
        }

        #time:after {
            content: attr(data-year);
            vertical-align: middle;
        }

        #total:before {
            content: "TOTAL ";
            font-size: .7em;
            color: #aaa;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            font: inherit;
            font-size: 10px;
            color: #000;
            background: #fff;
            border: 0;
            padding: 10px 16px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #555;
        }

        button:hover, button:focus-visible { background: #F9812E; }
        button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #555; }

        .credit {

        const PARTIES = ['US', 'CP', 'GB', 'FR', 'IN', 'PC', 'IS', null];
        const DAY = 1000 * 60 * 60 * 24;
        const BASE = Date.UTC(1945, 6, 16);

        const locs = LOCS.split(';').map(s => s.split(',').map(Number));
        const data = ROWS.split(' ').map(s => {
            const loc = s.length > 4 ? locs[parseInt(s.slice(4), 36)] : null;
            return {
                when: BASE + parseInt(s.slice(0, 3), 36) * DAY,
                party: PARTIES[+s[3]],
                lat: loc ? loc[0] : null,
                lon: loc ? loc[1] : null
            };
        });

        /* ---------- animation (after the original pen) ---------- */
        const cnvs = document.getElementById('stage'),
            ctx = cnvs.getContext('2d'),
            width = cnvs.width,
            height = cnvs.height,
            partyColors = {
                US: '#66f',
                GB: 'purple',
                CP: 'red',
                FR: 'green',
                IN: 'orange',
                PC: 'yellow',
                IS: 'cyan'
            };

        // longitude/latitude straight onto the map
        ctx.setTransform(width / 2 / 180, 0, 0, -height / 2 / 90, width / 2, height / 2);
        ctx.shadowBlur = 15;

        const timeEl = document.getElementById('time');
        function updateTime(val) {
            const d = new Date(val);
            timeEl.dataset.month = d.getUTCMonth() + 1;
            timeEl.dataset.year = d.getUTCFullYear();
        }

        function scoreKeeper(elem) {
            let count = 0;
            return {
                inc() {
                    if (count === 0) elem.classList.add('active');
                    elem.dataset.score = String(++count);
                },
                reset() {
                    count = 0;
                    elem.classList.remove('active');
                    elem.dataset.score = '0';
                }
            };
        }
        const total = scoreKeeper(document.getElementById('total'));
        const partyScore = {};
        ['US', 'CP', 'GB', 'FR', 'IN', 'PC', 'IS'].forEach(p => { partyScore[p] = scoreKeeper(document.getElementById(p)); });

        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        // the original pace: 120 days of history per second (slower when reduced motion is asked for)
        const SPEED = DAY * (reduceMotion ? 40 : 120);

        let head, tail, currentTime, lastTick, frame = 0, paused = false;

        function reset() {
            head = 0;
            tail = 0;
            currentTime = data[0].when - DAY * 360;
            lastTick = null;
            total.reset();
            document.getElementById('total').classList.add('active');
            Object.values(partyScore).forEach(s => s.reset());
            ctx.clearRect(-185, -95, 370, 190);
        }

        function render(tick) {
            ctx.clearRect(-185, -95, 370, 190);
            ctx.globalCompositeOperation = 'screen';

            if (!lastTick) lastTick = tick;
            currentTime += ((tick - lastTick) / 1000) * SPEED;
            updateTime(currentTime);

            while (data[head] && data[head].when < currentTime) {
                const d = data[head];
                total.inc();
                if (partyScore[d.party]) partyScore[d.party].inc();
                head++;
            }

            for (let i = tail; i < head; i++) {
                const d = data[i];
                const age = 2 - (currentTime - d.when) / (DAY * 180);
                const glowAge = 8 - (currentTime - d.when) / (DAY * 10);

                if (age < 0) {
                    tail++;
                    continue;
                }
                if (d.lat === null) continue;

                if (glowAge > 0) {
                    ctx.beginPath();
                    ctx.arc(d.lon, d.lat, glowAge, 0, Math.PI * 2);
                    ctx.shadowColor = ctx.fillStyle = partyColors[d.party] || '#fff';
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(d.lon, d.lat, age, 0, Math.PI * 2);
                ctx.shadowColor = 'transparent';
                ctx.fillStyle = 'white';
                ctx.fill();
            }

            lastTick = tick;
            frame = data[tail] && !paused ? requestAnimationFrame(render) : 0;
            if (!data[tail]) pauseBtn.disabled = true;
        }

        const pauseBtn = document.getElementById('pause');
        pauseBtn.addEventListener('click', () => {
            paused = !paused;
            pauseBtn.textContent = paused ? 'PLAY' : 'PAUSE';
            if (!paused && !frame) { lastTick = null; frame = requestAnimationFrame(render); }
        });

        document.getElementById('replay').addEventListener('click', () => {
            cancelAnimationFrame(frame);
            paused = false;
            pauseBtn.textContent = 'PAUSE';
            pauseBtn.disabled = false;
            reset();
            frame = requestAnimationFrame(render);
        });

        // the tab coming back after a while shouldn't jump decades ahead
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lastTick = null; });

        reset();
        frame = requestAnimationFrame(render);
    </script>
