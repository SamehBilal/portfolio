<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islamic Life Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;outline:none;border:none}
:root{
  --primary:#F9812E;
  --size:25px;
  --line:color-mix(in lch,canvasText,transparent 70%);
  --border-color:rgba(119,119,125,.2);
  --heading-color:light-dark(#000,#fff);
  --main-color:light-dark(#444,#e2e2e2);
  --card-bg:light-dark(#fff,#1D1D1D);
  --body-bg:light-dark(#fff,#000);

  --cat-spiritual: light-dark(rgba(16,185,129,.1),rgba(16,185,129,.12));
  --cat-spiritual-c: #10b981;
  --cat-knowledge:  light-dark(rgba(59,130,246,.1),rgba(59,130,246,.12));
  --cat-knowledge-c: #3b82f6;
  --cat-charity:    light-dark(rgba(245,158,11,.1),rgba(245,158,11,.12));
  --cat-charity-c:  #f59e0b;
  --cat-community:  light-dark(rgba(147,51,234,.1),rgba(147,51,234,.12));
  --cat-community-c:#9333ea;
  --cat-family:     light-dark(rgba(236,72,153,.1),rgba(236,72,153,.12));
  --cat-family-c:   #ec4899;
  --cat-personal:   light-dark(rgba(99,102,241,.1),rgba(99,102,241,.12));
  --cat-personal-c: #6366f1;
}
html{color-scheme:light dark;scroll-behavior:smooth}
[data-theme="light"]{color-scheme:light only}
[data-theme="dark"] {color-scheme:dark only}
body{
  font-family:"Poppins",sans-serif;
  background:var(--body-bg);color:var(--main-color);
  font-size:16px;line-height:28px;overflow-x:hidden;min-height:100vh;
}
body::before{
  content:'';height:80vh;width:100vw;position:fixed;top:0;
  background:
    linear-gradient(90deg,var(--line) 1px,transparent 1px var(--size)) 50% 50%/var(--size) var(--size),
    linear-gradient(var(--line) 1px,transparent 1px var(--size)) 50% 50%/var(--size) var(--size);
  -webkit-mask:linear-gradient(-20deg,transparent 50%,white);
  mask:linear-gradient(-20deg,transparent 50%,white);
  pointer-events:none;z-index:0;
}
h1,h2,h3,h4{color:var(--heading-color);font-family:"Poppins",sans-serif}

/* ── HEADER ── */
.main-header{
  position:fixed;left:0;top:0;z-index:999;width:100%;
  background:transparent;transition:all 500ms ease;
}
.main-header.fixed{background:var(--card-bg);box-shadow:0 2px 20px rgba(0,0,0,.08)}
.header-inner{
  max-width:1280px;margin:0 auto;padding:28px 24px;
  display:flex;align-items:center;transition:all 500ms ease;
}
.fixed .header-inner{padding:12px 24px}
.logo{display:inline-block;font-size:2vmin;cursor:pointer}
.logo-letter{
  position:relative;display:block;float:left;
  width:3vmin;height:3vmin;border-top:.25vmin solid var(--heading-color);
  line-height:3vmin;text-align:center;z-index:9999;
  transition:all .3s;color:var(--heading-color);font-size:1.1vmin;font-weight:700;
}
.logo-letter::before{
  position:absolute;top:-.25vmin;right:-.25vmin;
  display:block;width:.25vmin;height:3vmin;
  background:#F9812E;content:"";transition:all .3s;
}
.logo-letter:nth-child(2){transform:translateY(3vmin)}
.logo-letter:nth-child(3){transform:translateY(6vmin)}
.logo-letter:nth-child(4){transform:translateY(9vmin)}
.logo-letter:nth-child(5){transform:translateY(12vmin)}
.logo-letter.is-active{transform:translateY(0)!important}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.theme-btn{
  background:transparent;color:var(--heading-color);
  border:1px solid light-dark(#000,#fff);
  font-size:13px;font-weight:500;font-family:"Poppins",sans-serif;
  border-radius:15px;padding:10px 20px;cursor:pointer;transition:.3s;
}
.theme-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── PAGE ── */
.page-wrap{
  position:relative;z-index:1;
  max-width:1280px;margin:0 auto;
  padding:120px 24px 80px;
}

/* ── SECTION TITLE ── */
.section-title{margin-bottom:40px;text-align:center}
.section-title p{font-size:14px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:light-dark(#888,#a0aec0);margin-bottom:6px}
.section-title h2{font-size:clamp(28px,4vw,50px);font-weight:700;line-height:1.2;color:var(--heading-color)}
.section-title h2 span{color:var(--primary)}

/* ── PROGRESS CARD ── */
.container-inner{
  padding:40px;border:1px solid rgba(0,0,0,.05);border-radius:20px;
  box-shadow:rgba(255,255,255,.025) 0 .36px .65px -1px inset,rgba(255,255,255,.036) 0 3px 5.4px -2px inset;
  background:var(--card-bg);margin-bottom:24px;position:relative;z-index:1;
}
.progress-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.progress-head h3{font-size:18px;font-weight:700}
.progress-counts{font-size:13px;font-weight:600;color:var(--primary)}
.progress-track{
  width:100%;height:8px;border-radius:4px;
  background:light-dark(rgba(0,0,0,.08),rgba(255,255,255,.08));
  overflow:hidden;margin-bottom:10px;
}
.progress-fill{
  height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--primary),#ff6b00);
  transition:width .6s cubic-bezier(.4,0,.2,1);width:0;
}
.progress-sub{font-size:12px;color:light-dark(#aaa,#718096)}

/* ── FILTER BAR ── */
.filter-bar{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;
  position:relative;z-index:1;
}
.filter-btn{
  font-family:"Poppins",sans-serif;font-size:12px;font-weight:500;
  padding:7px 16px;border-radius:12px;cursor:pointer;
  border:2px solid transparent;transition:.22s;
  background:light-dark(rgba(0,0,0,.05),rgba(255,255,255,.06));
  color:light-dark(#777,#a0aec0);
}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:rgba(249,129,46,.12);color:var(--primary);border-color:var(--primary)}
.filter-btn[data-cat="spiritual"].active  {background:rgba(16,185,129,.1); color:var(--cat-spiritual-c); border-color:var(--cat-spiritual-c)}
.filter-btn[data-cat="knowledge"].active  {background:rgba(59,130,246,.1); color:var(--cat-knowledge-c); border-color:var(--cat-knowledge-c)}
.filter-btn[data-cat="charity"].active    {background:rgba(245,158,11,.1); color:var(--cat-charity-c);   border-color:var(--cat-charity-c)}
.filter-btn[data-cat="community"].active  {background:rgba(147,51,234,.1); color:var(--cat-community-c); border-color:var(--cat-community-c)}
.filter-btn[data-cat="family"].active     {background:rgba(236,72,153,.1); color:var(--cat-family-c);    border-color:var(--cat-family-c)}
.filter-btn[data-cat="personal"].active   {background:rgba(99,102,241,.1); color:var(--cat-personal-c);  border-color:var(--cat-personal-c)}

/* ── CHECKLIST GRID ── */
.checklist-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  position:relative;z-index:1;
}
@media(max-width:900px){.checklist-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.checklist-grid{grid-template-columns:1fr}}

/* ── CHECKLIST ITEM ── */
.cl-item{
  padding:20px;border-radius:18px;cursor:pointer;
  border:1px solid var(--border-color);
  background:var(--card-bg);
  box-shadow:rgba(255,255,255,.025) 0 .36px .65px -1px inset,rgba(255,255,255,.036) 0 3px 5.4px -2px inset;
  transition:border-color .2s,transform .18s,box-shadow .2s,opacity .25s;
  display:flex;flex-direction:column;gap:12px;
  position:relative;overflow:hidden;
}
.cl-item:hover{
  border-color:var(--primary);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(249,129,46,.12);
}
.cl-item.done{
  border-color:var(--primary) !important;
  background:light-dark(rgba(249,129,46,.04),rgba(249,129,46,.08)) !important;
}
.cl-item.hidden-item{display:none}

/* done strikethrough line */
.cl-item.done .cl-text{
  text-decoration:line-through;
  opacity:.55;
}

/* number badge */
.cl-num{
  position:absolute;top:14px;right:16px;
  font-size:10px;font-weight:700;letter-spacing:.5px;
  color:light-dark(#ccc,#444);
}

/* checkbox */
.cl-check{
  width:26px;height:26px;border-radius:8px;flex:none;
  border:2px solid var(--border-color);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;background:transparent;
}
.cl-item.done .cl-check{
  background:var(--primary);border-color:var(--primary);
}
.cl-check svg{width:14px;height:14px;stroke:#fff;stroke-width:2.5;fill:none;display:none}
.cl-item.done .cl-check svg{display:block}

.cl-row{display:flex;align-items:flex-start;gap:12px}
.cl-text{
  font-size:14px;font-weight:500;line-height:1.5;
  color:var(--heading-color);flex:1;padding-top:3px;
  transition:opacity .2s;
}

/* category badge */
.cl-cat{
  display:inline-block;font-size:10px;font-weight:600;
  letter-spacing:.4px;text-transform:capitalize;
  padding:4px 10px;border-radius:8px;
  border:1px solid transparent;
  align-self:flex-start;
}
.cl-cat.spiritual {background:var(--cat-spiritual);color:var(--cat-spiritual-c);border-color:rgba(16,185,129,.2)}
.cl-cat.knowledge {background:var(--cat-knowledge);color:var(--cat-knowledge-c);border-color:rgba(59,130,246,.2)}
.cl-cat.charity   {background:var(--cat-charity);  color:var(--cat-charity-c);  border-color:rgba(245,158,11,.2)}
.cl-cat.community {background:var(--cat-community);color:var(--cat-community-c);border-color:rgba(147,51,234,.2)}
.cl-cat.family    {background:var(--cat-family);   color:var(--cat-family-c);   border-color:rgba(236,72,153,.2)}
.cl-cat.personal  {background:var(--cat-personal); color:var(--cat-personal-c); border-color:rgba(99,102,241,.2)}

/* ── CONFETTI ── */
@keyframes confettiFall{
  0%  {transform:translateY(-10px) rotate(0deg);  opacity:1}
  100%{transform:translateY(60px)  rotate(720deg);opacity:0}
}
.confetti-dot{
  position:absolute;width:6px;height:6px;border-radius:50%;
  animation:confettiFall .7s ease-out forwards;pointer-events:none;
}

/* ── CTA STRIP ── */
.cta-strip{
  padding:60px 200px;border-radius:20px;text-align:center;margin-top:32px;
  border:1px solid rgba(0,0,0,.05);
  box-shadow:rgba(255,255,255,.025) 0 .36px .65px -1px inset,rgba(255,255,255,.036) 0 3px 5.4px -2px inset;
  background:var(--card-bg);position:relative;z-index:1;
}
@media(max-width:768px){.cta-strip{padding:40px 24px}}
.cta-strip h2{font-size:clamp(20px,3vw,38px);font-weight:800;text-transform:uppercase;line-height:1.2;margin-bottom:10px}
.cta-strip h2 span{-webkit-text-stroke:1px var(--heading-color);color:transparent}
.cta-strip p{font-size:13px;color:light-dark(#888,#a0aec0);line-height:1.8}

/* ── FOOTER ── */
footer{padding:32px 0;border-top:1px solid var(--border-color);margin-top:48px;text-align:center;position:relative;z-index:1}
footer p{font-size:13px;color:light-dark(#aaa,#666)}
footer a{color:var(--primary)}

/* ── SCROLL UP ── */
.scroll-up{
  position:fixed;bottom:30px;right:28px;width:44px;height:44px;border-radius:50%;
  background:var(--primary);color:#fff;display:none;align-items:center;
  justify-content:center;cursor:pointer;font-size:22px;z-index:999;
  box-shadow:0 4px 16px rgba(249,129,46,.35);transition:.3s;
}
.scroll-up.show{display:flex}
.scroll-up:hover{background:#000}
</style>
</head>

<!-- HEADER -->

<div class="page-wrap">

  </div>

  <!-- GRID -->

  <!-- CTA -->
  <div class="cta-strip">

    <p>Your progress is saved automatically. Come back anytime to continue your journey. 🤲</p>
  </div>

</div>

<footer>
  <div style="max-width:1280px;margin:0 auto;padding:0 24px">

    </p>
  </div>
</footer>

<div class="scroll-up" id="scrollUp" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

  {id:92, text:"Call or visit a relative you haven't spoken to in a year", cat:"family"},
  {id:93, text:"Read Quran together as a family regularly",               cat:"family"},
  {id:94, text:"Teach your children the basics of Islamic prayer",        cat:"family"},
  {id:95, text:"Plan and complete a family Umrah trip",                   cat:"family"},
  {id:96, text:"Write an Islamic will (Wasiyya) for your family",         cat:"family"},
  {id:97, text:"Reconcile a family dispute or broken relationship",       cat:"family"},
  {id:98, text:"Choose a righteous spouse with Islamic values",           cat:"family"},
  {id:99, text:"Name a child with a meaningful Islamic name",             cat:"family"},
  {id:100,text:"Leave your children a documented legacy of faith",        cat:"family"},

  {id:101,text:"Keep a gratitude journal of Allah's blessings daily",     cat:"personal"},
  {id:102,text:"Fast 6 days of Shawwal after Ramadan",                    cat:"personal"},
  {id:103,text:"Fast Mondays and Thursdays for a full month",             cat:"personal"},
  {id:104,text:"Fast the white days (13th, 14th, 15th) of each month",    cat:"personal"},
  {id:105,text:"Give up one haram habit permanently for Allah's sake",    cat:"personal"},
  {id:106,text:"Go a full day without backbiting or idle talk",           cat:"personal"},
  {id:107,text:"Lower your gaze consistently for 40 days",               cat:"personal"},
  {id:108,text:"Delete content from your devices that displeases Allah",  cat:"personal"},
  {id:109,text:"Spend a night in complete silence reflecting on death",   cat:"personal"},
  {id:110,text:"Write a letter to yourself about who you want to be for Allah", cat:"personal"},
];

const CAT_COLORS = {
  spiritual: '#10b981', knowledge: '#3b82f6', charity: '#f59e0b',
  community: '#9333ea', family: '#ec4899',   personal: '#6366f1'
};

/* ── STATE ── */
let checked = {};
let activeFilter = 'all';

try {
  const s = localStorage.getItem('islamicChecklist_v2');
  if (s) checked = JSON.parse(s);
} catch(e){}

function save() {
  try { localStorage.setItem('islamicChecklist_v2', JSON.stringify(checked)); } catch(e){}
}

/* ── PROGRESS ── */
function updateProgress() {
  const done  = ITEMS.filter(i => checked[i.id]).length;
  const total = ITEMS.length;
  const pct   = (done / total) * 100;

  document.getElementById('progCounts').textContent = `${done} / ${total}`;
  document.getElementById('progFill').style.width   = pct + '%';

  const msgs = [
    [0,   'Start your journey! 🌙'],
    [10,  'Great start! Keep going 💪'],
    [25,  'A quarter done — amazing! ✨'],
    [50,  'Halfway there, Masha\'Allah! 🌟'],
    [75,  'Almost there, keep it up! 🚀'],
    [100, 'Alhamdulillah — completed! 🎉'],
  ];
  const msg = msgs.reduce((a, m) => pct >= m[0] ? m : a, msgs[0]);
  document.getElementById('progSub').textContent = `${pct.toFixed(1)}% complete — ${msg[1]}`;

  // category mini-bars
  const cats = [...new Set(ITEMS.map(i => i.cat))];
  document.getElementById('catBars').innerHTML = cats.map(cat => {
    const catItems = ITEMS.filter(i => i.cat === cat);
    const catDone  = catItems.filter(i => checked[i.id]).length;
    const catPct   = Math.round((catDone / catItems.length) * 100);
    const col      = CAT_COLORS[cat];
    return `<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:light-dark(#888,#a0aec0)">
      <span style="width:8px;height:8px;border-radius:50%;background:${col};flex:none"></span>
      <span style="color:${col};font-weight:600">${cat}</span>
      <span style="color:light-dark(#bbb,#718096)">${catDone}/${catItems.length}</span>
    </div>`;
  }).join('');
}

/* ── FILTER ── */
function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  document.querySelectorAll('.cl-item').forEach(el => {
    const iCat  = el.dataset.cat;
    const isDone = !!checked[el.dataset.id];
    let show = false;
    if (cat === 'all')   show = true;
    else if (cat === 'done')  show = isDone;
    else if (cat === 'undone')show = !isDone;
    else                 show = iCat === cat;
    el.classList.toggle('hidden-item', !show);
  });
}

/* ── CONFETTI ── */
function spawnConfetti(el) {
  const colors = ['#F9812E','#10b981','#3b82f6','#f59e0b','#9333ea','#ec4899'];
  for (let i = 0; i < 8; i++) {
    const dot = document.createElement('div');
    dot.className = 'confetti-dot';
    dot.style.cssText = `
      left:${10 + Math.random()*80}%;
      top:${10 + Math.random()*60}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-delay:${Math.random()*0.2}s;
      animation-duration:${0.5+Math.random()*0.4}s;
    `;
    el.appendChild(dot);
    dot.addEventListener('animationend', () => dot.remove());
  }
}

/* ── TOGGLE ── */
function toggleItem(id, el) {
  checked[id] = !checked[id];
  save();
  el.classList.toggle('done', !!checked[id]);
  if (checked[id]) spawnConfetti(el);
  setFilter(activeFilter); // re-apply filter visibility
  updateProgress();
}

/* ── RENDER ── */
function render() {
  const grid = document.getElementById('clGrid');
  grid.innerHTML = ITEMS.map(item => `
    <div class="cl-item${checked[item.id]?' done':''}"
         data-id="${item.id}" data-cat="${item.cat}"
         onclick="toggleItem(${item.id}, this)">
      <span class="cl-num">#${item.id}</span>
      <div class="cl-row">
        <div class="cl-check">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        </div>
        <span class="cl-text">${item.text}</span>
      </div>
      <span class="cl-cat ${item.cat}">${item.cat}</span>
    </div>
  `).join('');
  updateProgress();
}

/* ── THEME ── */
function toggleTheme() {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
}

/* ── SCROLL ── */
window.addEventListener('scroll', () => {
  document.getElementById('mainHeader').classList.toggle('fixed', window.scrollY > 60);
  document.getElementById('scrollUp').classList.toggle('show', window.scrollY > 300);
});

render();
</script>
</body>
</html>
